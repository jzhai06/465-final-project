<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .table { fill: #f7fbff; stroke: #1d4e89; stroke-width: 2; }
    .header { fill: #1d4e89; }
    .title { fill: white; font: bold 16px Arial, sans-serif; }
    .field { fill: #17202a; font: 13px Consolas, monospace; }
    .relation { stroke: #555; stroke-width: 2; fill: none; }
    .label { fill: #444; font: 12px Arial, sans-serif; }
  </style>
  <text x="600" y="28" text-anchor="middle" font="bold 24px Arial">Reselling Tracker ER Diagram</text>

  <g transform="translate(40 70)">
    <rect class="table" width="220" height="150" rx="4"/><rect class="header" width="220" height="30"/>
    <text class="title" x="110" y="21" text-anchor="middle">brand</text>
    <text class="field" x="12" y="52">PK brand_id INTEGER</text><text class="field" x="12" y="75">brand_name TEXT UNIQUE</text>
  </g>
  <g transform="translate(40 300)">
    <rect class="table" width="220" height="150" rx="4"/><rect class="header" width="220" height="30"/>
    <text class="title" x="110" y="21" text-anchor="middle">category</text>
    <text class="field" x="12" y="52">PK category_id INTEGER</text><text class="field" x="12" y="75">category_name TEXT UNIQUE</text>
  </g>
  <g transform="translate(40 530)">
    <rect class="table" width="250" height="170" rx="4"/><rect class="header" width="250" height="30"/>
    <text class="title" x="125" y="21" text-anchor="middle">sourcing_location</text>
    <text class="field" x="12" y="52">PK location_id INTEGER</text><text class="field" x="12" y="75">location_name TEXT</text><text class="field" x="12" y="98">city TEXT</text><text class="field" x="12" y="121">UNIQUE (name, city)</text>
  </g>
  <g transform="translate(350 70)">
    <rect class="table" width="300" height="240" rx="4"/><rect class="header" width="300" height="30"/>
    <text class="title" x="150" y="21" text-anchor="middle">item</text>
    <text class="field" x="12" y="52">PK item_id INTEGER</text><text class="field" x="12" y="75">FK brand_id</text><text class="field" x="12" y="98">FK category_id</text><text class="field" x="12" y="121">FK location_id (nullable)</text><text class="field" x="12" y="144">title TEXT</text><text class="field" x="12" y="167">condition TEXT</text><text class="field" x="12" y="190">purchase_cost REAL</text><text class="field" x="12" y="213">acquired_date TEXT</text>
  </g>
  <g transform="translate(720 70)">
    <rect class="table" width="250" height="170" rx="4"/><rect class="header" width="250" height="30"/>
    <text class="title" x="125" y="21" text-anchor="middle">platform</text>
    <text class="field" x="12" y="52">PK platform_id INTEGER</text><text class="field" x="12" y="75">platform_name TEXT UNIQUE</text><text class="field" x="12" y="98">fee_percent REAL</text>
  </g>
  <g transform="translate(720 320)">
    <rect class="table" width="300" height="220" rx="4"/><rect class="header" width="300" height="30"/>
    <text class="title" x="150" y="21" text-anchor="middle">listing</text>
    <text class="field" x="12" y="52">PK listing_id INTEGER</text><text class="field" x="12" y="75">FK item_id</text><text class="field" x="12" y="98">FK platform_id</text><text class="field" x="12" y="121">list_price REAL</text><text class="field" x="12" y="144">listed_date TEXT</text><text class="field" x="12" y="167">ended_date TEXT nullable</text><text class="field" x="12" y="190">status TEXT</text>
  </g>
  <g transform="translate(420 500)">
    <rect class="table" width="250" height="170" rx="4"/><rect class="header" width="250" height="30"/>
    <text class="title" x="125" y="21" text-anchor="middle">sale</text>
    <text class="field" x="12" y="52">PK sale_id INTEGER</text><text class="field" x="12" y="75">FK listing_id UNIQUE</text><text class="field" x="12" y="98">sale_date TEXT</text><text class="field" x="12" y="121">sale_price REAL</text><text class="field" x="12" y="144">platform_fee REAL</text>
  </g>
  <path class="relation" d="M260 130 H350 M260 360 H350 M290 615 H350 V215 M650 160 H720 M650 215 H720 V400 M870 240 V320 M650 260 C680 350 700 430 720 430 M570 500 V310"/>
  <text class="label" x="275" y="122">1:M</text><text class="label" x="275" y="352">1:M</text><text class="label" x="298" y="607">1:M</text><text class="label" x="670" y="152">1:M</text><text class="label" x="675" y="285">1:M</text><text class="label" x="875" y="282">1:M</text><text class="label" x="580" y="395">1:M</text>
  <text x="1060" y="100" font="bold 14px Arial">View: v_sale_profit</text>
  <text x="1060" y="125" font="13px Arial">Joins sale, listing, item,</text><text x="1060" y="145" font="13px Arial">brand, category, platform,</text><text x="1060" y="165" font="13px Arial">and sourcing_location.</text>
</svg>
